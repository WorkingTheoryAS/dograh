name: Build & push santaclues-fork dograh-api image

on:
  push:
    branches: [santaclues]
    paths:
      - "api/**"
      - ".github/workflows/build-santaclues-api.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-santaclues-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # SHA-pin all third-party Actions per the SantaClues hardening
      # policy (tag-repoint = supply-chain MITM). Update via Renovate.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/morten202020/santaclues-dograh-api:latest
            ghcr.io/morten202020/santaclues-dograh-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
